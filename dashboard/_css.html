<style>
#dash-root { --dash-gutter: var(--cds-pad-lg); }
.dpm [hidden] { display: none !important; }
.dpm .card > p:empty, .dpm .result > p:empty { display: none; }
.dpm { font-family: var(--font-anthropic-sans); display: grid; gap: var(--cds-gap-lg); max-width: 1180px; margin-inline: auto; }
.dpm h1 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: calc(var(--cds-font-size-title) * 1.15); line-height: 1.15; margin: 0; text-wrap: balance; }
.dpm h2 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 0; }
.dpm h3 { font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); margin: 0; }
.dpm .masthead { display: grid; gap: var(--cds-gap-xs); }
.dpm .lede { color: var(--color-fg); margin: 0; max-width: 68ch; line-height: 1.5; }
.dpm .meta-line { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); margin: 0; }
.dpm .muted { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); margin: 0; }
.dpm .note { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); margin: 0; max-width: 75ch; line-height: 1.45; }
.dpm .num { font-variant-numeric: tabular-nums; }
.dpm a { color: inherit; }

/* tabs: one row that scrolls sideways on a phone */
.dpm .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--color-border-line); overflow-x: auto; scrollbar-width: none; position: sticky; top: 0; z-index: 3; background: var(--color-bg); }
.dpm .tabs::-webkit-scrollbar { display: none; }
.dpm .tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: var(--cds-pad-sm) var(--cds-pad-md); font: inherit; color: var(--color-fg-muted); cursor: pointer; white-space: nowrap; flex: none; }
.dpm .tab:hover { color: var(--color-fg); }
.dpm .tab[aria-selected="true"] { color: var(--color-fg); border-bottom-color: var(--color-fg); font-weight: var(--cds-font-weight-medium); }
.dpm .tab:focus-visible, .dpm button:focus-visible, .dpm input:focus-visible, .dpm select:focus-visible, .dpm summary:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }

/* layout */
.dpm .grid { display: grid; gap: var(--cds-gap-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); align-items: start; }
.dpm .grid.two { gap: var(--cds-gap-lg); }
.dpm .grid-wide { display: grid; gap: var(--cds-gap-md); grid-template-columns: minmax(0, 1fr); }
.dpm .split { display: grid; gap: var(--cds-gap-md); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (max-width: 899px) { .dpm .split .result { order: -1; } }
@media (min-width: 900px) { .dpm .split { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); } .dpm .split .result { position: sticky; top: 52px; } }
.dpm .card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); display: grid; gap: var(--cds-gap-sm); align-content: start; min-width: 0; }
.dpm .card > header { display: grid; gap: 3px; }
.dpm .tiles { display: grid; gap: var(--cds-gap-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); }
.dpm .tile { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md); display: grid; gap: 4px; min-width: 0; align-content: start; }
.dpm .tile .big { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); font-variant-numeric: tabular-nums; line-height: 1.15; }
.dpm .label { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }

/* the result panel */
.dpm .result { gap: var(--cds-gap-xs); }
.dpm .hero-num { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: calc(var(--cds-font-size-title) * 1.6); line-height: 1.05; font-variant-numeric: tabular-nums; }
.dpm .rangebar { position: relative; height: 34px; margin-top: var(--cds-gap-xs); }
.dpm .rangebar svg { display: block; overflow: visible; }
.dpm .conf { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 0; font-size: var(--cds-font-size-caption); color: var(--color-fg); }
.dpm .conf .dot { width: .55rem; height: .55rem; border-radius: 50%; display: inline-block; }
.dpm .cond-row { display: grid; gap: 2px; padding-top: var(--cds-pad-sm); border-top: 1px solid var(--color-border-line); margin-top: var(--cds-gap-xs); }
.dpm .mid { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: calc(var(--cds-font-size-title) * 0.8); font-variant-numeric: tabular-nums; line-height: 1.2; }
.dpm .mini { display: grid; gap: var(--cds-gap-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); padding-top: var(--cds-pad-sm); border-top: 1px solid var(--color-border-line); margin-top: var(--cds-gap-xs); }
.dpm .mini > div { display: grid; gap: 2px; align-content: start; min-width: 0; }
.dpm .save { padding-top: var(--cds-pad-sm); border-top: 1px solid var(--color-border-line); margin-top: var(--cds-gap-xs); display: grid; gap: 4px; }
.dpm .save input { flex: 1; min-width: 8rem; width: auto; }

/* forms */
.dpm .form { display: grid; gap: var(--cds-gap-sm); grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); align-items: end; }
.dpm .form .span2 { grid-column: span 2; }
@media (max-width: 520px) { .dpm .form .span2 { grid-column: auto; } }
.dpm .form.narrow2 { max-width: 30rem; } .dpm .form.narrow3 { max-width: 36rem; }
.dpm label.fld { display: grid; gap: 4px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); min-width: 0; }
.dpm input, .dpm select, .dpm textarea { font: inherit; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 7px 9px; min-width: 0; width: 100%; box-sizing: border-box; }
.dpm textarea { min-height: 5.5rem; resize: vertical; }
.dpm input[type="checkbox"] { width: auto; }
.dpm .chk { display: flex; gap: 6px; align-items: center; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); padding-block: 8px; }
.dpm .fieldsets { display: grid; gap: var(--cds-gap-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); }
.dpm fieldset { border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md); margin: 0; min-width: 0; }
.dpm legend { font-size: var(--cds-font-size-caption); font-weight: var(--cds-font-weight-medium); color: var(--color-fg); padding: 0 4px; }
.dpm .btn { font: inherit; cursor: pointer; padding: 6px 14px; border-radius: var(--cds-radius); border: 1px solid var(--color-fg); background: var(--color-fg); color: var(--color-bg); }
.dpm .btn.quiet { background: var(--color-bg); color: var(--color-fg); border-color: var(--color-border-line); }
.dpm .btn:disabled { opacity: .5; cursor: default; }
.dpm .btn-row { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); align-items: center; }
.dpm .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.dpm .chips button { all: unset; cursor: pointer; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--color-border-line); font-size: var(--cds-font-size-caption); }
.dpm .chips button.keep { border-style: dashed; color: var(--color-fg-muted); }
.dpm details > summary { cursor: pointer; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.dpm details > summary:hover { color: var(--color-fg); }
.dpm details.listing { border: 1px dashed var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-sm) var(--cds-pad-md); }
.dpm details.listing[open] > summary { margin-bottom: var(--cds-gap-sm); }
.dpm .sub { display: grid; gap: var(--cds-gap-sm); }
.dpm .err { color: var(--color-bad); font-size: var(--cds-font-size-caption); min-height: 0; margin: 0; }
.dpm .err:empty { display: none; }
.dpm .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--color-border-line); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.dpm .good { color: var(--color-ok); } .dpm .warnc { color: var(--color-warn); } .dpm .badc { color: var(--color-bad); }
.dpm .verdict { font-size: var(--cds-font-size-caption); }

/* tables */
.dpm .tbl-wrap { overflow: auto; max-height: 26rem; }
.dpm table { border-collapse: collapse; width: 100%; font-size: var(--cds-font-size-caption); font-variant-numeric: tabular-nums; }
.dpm th, .dpm td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
.dpm td.r, .dpm th.r { text-align: right; }
.dpm th { position: sticky; top: 0; background: var(--color-panel); color: var(--color-fg-muted); font-weight: var(--cds-font-weight-medium); }
.dpm th button { all: unset; cursor: pointer; }
.dpm tbody tr:hover td { background: color-mix(in srgb, var(--color-fg) 4%, transparent); }
.dpm .show-narrow { display: none; }
@media (max-width: 640px) { .dpm .hide-narrow { display: none; } .dpm .show-narrow { display: block; font-size: 0.92em; } }
/* wide tables get the full row on desktop rather than scrolling inside a half-width card */
.dpm .grid > .card.wide { grid-column: 1 / -1; }
.dpm table.wrap-last td:last-child, .dpm table.wrap-last th:last-child { white-space: normal; min-width: 14rem; }
/* on a phone the first column (an address, a check, a change) wraps instead of pushing the figures off the card */
@media (max-width: 640px) { .dpm table.wrap-first td:first-child, .dpm table.wrap-first th:first-child { white-space: normal; min-width: 8.5rem; } .dpm th, .dpm td { padding: 6px 5px; } }

/* charts */
.dpm .chart { position: relative; min-height: 240px; }
.dpm .chart.short { min-height: 0; }
.dpm .fan-h { margin-top: var(--cds-gap-sm); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); font-weight: var(--cds-font-weight-medium); }
.dpm .rate-try { display: grid; grid-template-columns: auto minmax(0, 1fr) 4.5em; align-items: center; gap: var(--cds-gap-sm); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.dpm .rate-try output { color: var(--color-fg); font-variant-numeric: tabular-nums; text-align: right; font-size: var(--cds-font-size-body); }
.dpm .rate-try input[type=range] { width: 100%; margin: 0; accent-color: var(--color-fg); cursor: pointer; }
.dpm .chart svg { display: block; }
.dpm .tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; z-index: 2; }
.dpm .tip .t { color: var(--cds-text-secondary); }
.dpm .legend { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.dpm .legend span { display: inline-flex; align-items: center; gap: 6px; }
.dpm .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.dpm .kv { display: grid; grid-template-columns: 1fr auto; gap: 5px var(--cds-gap-md); font-size: var(--cds-font-size-caption); margin: 0; }
.dpm .kv dt { color: var(--color-fg-muted); } .dpm .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.dpm .kv .sep { grid-column: 1 / -1; border-top: 1px solid var(--color-border-line); }
/* on a phone a long value (a school's name) wraps rather than squeezing its label to one word a line */
@media (max-width: 640px) { .dpm .kv { grid-template-columns: minmax(45%, 1fr) auto; } }
.dpm .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); overflow: hidden; }
.dpm .seg button { all: unset; cursor: pointer; padding: 4px 10px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.dpm .seg button[aria-pressed="true"] { background: var(--color-bg); color: var(--color-fg); }
.dpm .row { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: flex-start; justify-content: space-between; }

/* landlord rules and method */
.dpm .rules-grid { display: grid; gap: var(--cds-gap-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); }
.dpm .rules article { display: grid; gap: 3px; border-top: 1px solid var(--color-border-line); padding-top: var(--cds-pad-sm); align-content: start; }
.dpm .rules article p { margin: 0; line-height: 1.5; font-size: var(--cds-font-size-body); }
.dpm .method p, .dpm .method li { line-height: 1.55; }
.dpm .method ul { padding-left: 1.1em; margin: 0; display: grid; gap: 6px; font-size: var(--cds-font-size-body); }
.dpm .flow { list-style: none; counter-reset: step; margin: 0; padding: 0; display: grid; gap: var(--cds-gap-sm); grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); }
.dpm .flow li { counter-increment: step; display: grid; gap: 4px; align-content: start; padding: var(--cds-pad-md); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); position: relative; }
.dpm .flow li::before { content: counter(step); font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-heading); color: var(--color-fg-muted); }
.dpm .flow li span { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.45; }
.dpm .foot { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.5; border-top: 1px solid var(--color-border-line); padding-top: var(--cds-pad-md); max-width: 110ch; }
/* masthead and the light/dark switch */
.dpm .mast-top { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: flex-start; justify-content: space-between; }
.dpm .theme-toggle { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 5px 8px 5px 10px; border: 1px solid var(--color-border-line); border-radius: 999px; font-size: var(--cds-font-size-caption); color: var(--color-fg); background: var(--color-panel); flex: none; margin-top: 4px; }
.dpm .theme-toggle:hover { border-color: var(--color-fg-muted); }
.dpm .theme-toggle svg { width: 15px; height: 15px; }
.dpm .tt-track { width: 28px; height: 16px; border-radius: 999px; background: var(--cds-chart-muted); position: relative; transition: background var(--cds-dur-slow); }
.dpm .tt-knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--color-bg); transition: transform var(--cds-dur-slow); }
.dpm .theme-toggle[aria-pressed="true"] .tt-track { background: var(--color-fg); }
.dpm .theme-toggle[aria-pressed="true"] .tt-knob { transform: translateX(12px); }

/* neighbourhood search and controls */
.dpm .nb-find { gap: var(--cds-gap-sm); }
.dpm .nb-search-label { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
.dpm .nb-search { position: relative; max-width: 40rem; }
.dpm .nb-search input { padding: 9px 12px 9px 36px; font-size: var(--cds-font-size-body); }
.dpm .nb-search-icon { position: absolute; left: 11px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: var(--color-fg-muted); pointer-events: none; }
.dpm .nb-results { position: absolute; z-index: 6; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); max-height: 20rem; overflow: auto; }
.dpm .nb-results li { display: grid; gap: 1px; padding: 6px 9px; border-radius: 6px; cursor: pointer; }
.dpm .nb-results li[aria-selected="true"], .dpm .nb-results li[id]:hover { background: color-mix(in srgb, var(--color-fg) 8%, transparent); }
.dpm .nb-results .r1 { font-size: var(--cds-font-size-body); color: var(--color-fg); }
.dpm .nb-results .r2 { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.dpm .nb-results li.none { cursor: default; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.dpm .nb-ctl { display: flex; flex-wrap: wrap; gap: var(--cds-gap-md) var(--cds-gap-lg); align-items: flex-start; padding-top: var(--cds-pad-md); border-top: 1px solid var(--color-border-line); margin-top: var(--cds-gap-xs); }
.dpm .nb-ctl-item { display: grid; gap: 5px; min-width: 0; }
.dpm .nb-custom { display: grid; gap: 4px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); max-width: 9rem; }

/* one neighbourhood */
.dpm .nb-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); line-height: 1.15; }
.dpm .nb-badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: 30rem; justify-content: flex-end; }
.dpm .pill.strong { color: var(--color-fg); border-color: var(--color-fg-muted); }
.dpm button.pill { all: unset; cursor: pointer; display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px dashed var(--color-fg-muted); font-size: var(--cds-font-size-caption); color: var(--color-fg); }
.dpm .nb-tiles { display: grid; gap: var(--cds-gap-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); padding: var(--cds-pad-md) 0; border-block: 1px solid var(--color-border-line); }
.dpm .nb-tiles > div { display: grid; gap: 2px; align-content: start; min-width: 0; }
.dpm .nb-detail { align-items: start; }
.dpm .nb-facts-wrap { max-height: 32rem; }
.dpm #nb-facts th[scope="rowgroup"] { position: static; background: none; padding-top: 14px; color: var(--color-fg); }
.dpm #nb-facts td:first-child { color: var(--color-fg-muted); white-space: normal; }

/* map */
.dpm .map-pick { min-width: 15rem; }
.dpm .map-legend i { width: 14px; border: 1px solid var(--color-border-line); }

/* best buy-to-let */
.dpm .btl-form { max-width: 34rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); }
.dpm .btl-top { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--cds-gap-sm); grid-template-columns: repeat(auto-fit, minmax(min(100%, 12.5rem), 1fr)); }
.dpm .btl-top > li { display: grid; }
.dpm .btl-top button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 3px; align-content: start; padding: var(--cds-pad-md); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); min-width: 0; }
.dpm .btl-top button:hover { border-color: var(--color-fg-muted); }
.dpm .btl-top button[aria-current="true"] { border-color: var(--color-fg); box-shadow: inset 0 0 0 1px var(--color-fg); }
.dpm .btl-top .rk { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.dpm .btl-top .nm { font-weight: var(--cds-font-weight-medium); }
.dpm .btl-top .bigv { font-family: var(--font-anthropic-serif); font-size: calc(var(--cds-font-size-title) * .85); line-height: 1.15; font-variant-numeric: tabular-nums; margin-top: 4px; }
.dpm .btl-top .ln { font-size: var(--cds-font-size-caption); margin-top: 4px; }
.dpm .btl-top .pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.dpm #btl-table tbody tr { cursor: pointer; }
.dpm #btl-table tbody tr[aria-current="true"] td { background: color-mix(in srgb, var(--color-fg) 8%, transparent); }
.dpm #btl-table td:first-child { font-weight: var(--cds-font-weight-medium); }
/* fifteen columns: headings and names wrap so the table fits a desktop card instead of hiding its last columns */
.dpm #btl-table th { white-space: normal; vertical-align: bottom; }
.dpm #btl-table th:first-child, .dpm #btl-table td:first-child { white-space: normal; min-width: 9rem; }
.dpm #btl-table th, .dpm #btl-table td { padding: 6px 6px; }

/* invest: this home against its neighbourhood, and its rent */
.dpm .inv-head { display: grid; gap: var(--cds-gap-md); grid-template-columns: minmax(0, 1fr); padding: var(--cds-pad-md) 0; border-block: 1px solid var(--color-border-line); }
@media (min-width: 900px) { .dpm .inv-head { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); align-items: center; } }
.dpm .inv-verdict { display: grid; gap: 2px; align-content: start; }
.dpm .inv-big { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: calc(var(--cds-font-size-title) * 1.6); line-height: 1.05; font-variant-numeric: tabular-nums; }
.dpm .inv-verdict-t { font-size: var(--cds-font-size-body); line-height: 1.4; max-width: 34ch; }
.dpm .inv-kpis { display: grid; gap: var(--cds-gap-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); }
